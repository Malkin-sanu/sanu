<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8c0ff"/>
      <stop offset="50%" stop-color="#e7c6ff"/>
      <stop offset="100%" stop-color="#ffd6e0"/>
    </linearGradient>
  </defs>

  <rect width="500" height="400" rx="16" fill="url(#bg10)"/>

  <!-- Window Frame with Raindrops Outside -->
  <g transform="translate(80, 70)">
    <rect width="340" height="230" rx="12" fill="#edf2f4" stroke="#ffccd5" stroke-width="4"/>
    <rect x="15" y="15" width="145" height="95" rx="6" fill="#a2d2ff" opacity="0.6"/>
    <rect x="180" y="15" width="145" height="95" rx="6" fill="#a2d2ff" opacity="0.6"/>
    <rect x="15" y="120" width="145" height="95" rx="6" fill="#a2d2ff" opacity="0.6"/>
    <rect x="180" y="120" width="145" height="95" rx="6" fill="#a2d2ff" opacity="0.6"/>

    <!-- Raindrops on Window Glass -->
    <g fill="#ffffff" opacity="0.8">
      <ellipse cx="40" cy="50" rx="2" ry="6"/>
      <ellipse cx="90" cy="75" rx="2" ry="7"/>
      <ellipse cx="130" cy="35" rx="2" ry="5"/>
      <ellipse cx="220" cy="60" rx="2" ry="6"/>
      <ellipse cx="270" cy="40" rx="2" ry="8"/>
      <ellipse cx="50" cy="160" rx="2" ry="7"/>
      <ellipse cx="110" cy="180" rx="2" ry="6"/>
      <ellipse cx="230" cy="170" rx="2" ry="6"/>
      <ellipse cx="290" cy="150" rx="2" ry="7"/>
    </g>
  </g>

  <!-- Cozy Mug of Tea & Pastry on Windowsill -->
  <g transform="translate(210, 240)">
    <!-- Cozy Ceramic Mug -->
    <rect x="25" y="25" width="46" height="50" rx="10" fill="#ff758f"/>
    <!-- Mug Handle -->
    <path d="M 70,35 C 85,35 85,62 70,62" fill="none" stroke="#ff758f" stroke-width="5" stroke-linecap="round"/>
    <!-- Cute Heart on Mug -->
    <path d="M 48,50 C 48,46 53,46 53,50 C 53,54 48,58 48,58 C 48,58 43,54 43,50 C 43,46 48,46 48,50 Z" fill="#ffffff"/>

    <!-- Steaming Swirls -->
    <path d="M 40,15 Q 35,5 42,-5 Q 50,-15 42,-25" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,4"/>
    <path d="M 55,18 Q 62,8 55,-2 Q 48,-12 56,-22" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,4"/>
  </g>

  <!-- Cozy Knit Blanket Texture across bottom -->
  <path d="M 0,330 Q 120,315 250,330 Q 380,315 500,330 L 500,400 L 0,400 Z" fill="#ffb3c6"/>
  <path d="M 0,350 Q 120,335 250,350 Q 380,335 500,350 L 500,400 L 0,400 Z" fill="#ff85a1"/>

  <!-- Title Badge -->
  <g transform="translate(250, 48)" text-anchor="middle">
    <rect x="-145" y="-18" width="290" height="36" rx="18" fill="#ffffff" filter="drop-shadow(0 4px 10px rgba(255,105,135,0.25))"/>
    <text y="6" font-family="'Quicksand', sans-serif" font-size="14.5" font-weight="700" fill="#e73868">🌧️ Rainy Days & Cozy Warm Tea 🫖</text>
  </g>
</svg>
