<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg14" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140152"/>
      <stop offset="50%" stop-color="#22007c"/>
      <stop offset="100%" stop-color="#49117c"/>
    </linearGradient>
  </defs>

  <rect width="500" height="400" rx="16" fill="url(#bg14)"/>

  <!-- Dreamy Galaxy Dust -->
  <ellipse cx="250" cy="180" rx="180" ry="70" fill="#f72585" opacity="0.25" transform="rotate(-15, 250, 180)"/>
  <ellipse cx="250" cy="180" rx="140" ry="50" fill="#4cc9f0" opacity="0.2" transform="rotate(-15, 250, 180)"/>

  <!-- Constellations & Stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="80" r="2"/>
    <circle cx="140" cy="120" r="3"/>
    <circle cx="210" cy="90" r="2.5"/>
    <circle cx="300" cy="130" r="3"/>
    <circle cx="380" cy="90" r="2"/>
    <circle cx="430" cy="140" r="2.5"/>
    <circle cx="100" cy="200" r="1.5"/>
    <circle cx="400" cy="220" r="1.5"/>
  </g>
  <!-- Constellation Lines (Heart Shaped Constellation!) -->
  <g stroke="#ffffff" stroke-width="1.2" opacity="0.6" stroke-dasharray="3,3">
    <line x1="220" y1="120" x2="250" y2="90"/>
    <line x1="250" y1="90" x2="280" y2="120"/>
    <line x1="280" y1="120" x2="250" y2="160"/>
    <line x1="250" y1="160" x2="220" y2="120"/>
  </g>

  <!-- Big Telescope on Tripod -->
  <g transform="translate(200, 190)">
    <!-- Tripod Legs -->
    <line x1="50" y1="70" x2="10" y2="170" stroke="#9a8c98" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="70" x2="50" y2="170" stroke="#9a8c98" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="70" x2="90" y2="170" stroke="#9a8c98" stroke-width="4" stroke-linecap="round"/>
    <!-- Mount -->
    <circle cx="50" cy="70" r="8" fill="#ff758f"/>
    <!-- Telescope Tube (Pointing up right at ~35 deg) -->
    <g transform="translate(50, 70) rotate(-35)">
      <rect x="-40" y="-12" width="110" height="24" rx="4" fill="#ffffff" stroke="#ffccd5" stroke-width="2"/>
      <rect x="65" y="-14" width="15" height="28" rx="2" fill="#ff4d6d"/>
      <rect x="-46" y="-7" width="10" height="14" rx="2" fill="#ffd166"/>
    </g>
  </g>

  <!-- Title Badge -->
  <g transform="translate(250, 48)" text-anchor="middle">
    <rect x="-145" y="-18" width="290" height="36" rx="18" fill="#ffffff" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.4))"/>
    <text y="6" font-family="'Quicksand', sans-serif" font-size="14.5" font-weight="700" fill="#e73868">🌌 Stargazing & Sharing Our Dreams ✨</text>
  </g>
</svg>
