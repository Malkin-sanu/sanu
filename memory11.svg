<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg11" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b2d42"/>
      <stop offset="50%" stop-color="#3d348b"/>
      <stop offset="100%" stop-color="#7678ed"/>
    </linearGradient>
  </defs>

  <rect width="500" height="400" rx="16" fill="url(#bg11)"/>

  <!-- Movie Screen Glow Effect -->
  <polygon points="120,40 380,40 460,360 40,360" fill="#ffffff" opacity="0.08"/>

  <!-- Movie Clapperboard (Left) -->
  <g transform="translate(90, 140) rotate(-14)">
    <rect width="90" height="70" rx="6" fill="#1d1e2c" stroke="#ffccd5" stroke-width="2"/>
    <rect y="12" width="90" height="4" fill="#ff758f"/>
    <!-- Clapper top stick -->
    <g transform="translate(0, -18) rotate(-18)">
      <rect width="90" height="18" rx="4" fill="#1d1e2c" stroke="#ffccd5" stroke-width="2"/>
      <polygon points="15,0 25,0 15,18 5,18" fill="#ffffff"/>
      <polygon points="40,0 50,0 40,18 30,18" fill="#ffffff"/>
      <polygon points="65,0 75,0 65,18 55,18" fill="#ffffff"/>
    </g>
    <text x="45" y="45" font-family="'Quicksand', sans-serif" font-size="11" font-weight="700" fill="#ffd166" text-anchor="middle">BESTIES</text>
    <text x="45" y="60" font-family="'Quicksand', sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">TAKE 100 💕</text>
  </g>

  <!-- Giant Striped Popcorn Bucket (Right) -->
  <g transform="translate(260, 150)">
    <!-- Bucket Body -->
    <polygon points="15,40 85,40 75,130 25,130" fill="#ffffff" stroke="#ff4d6d" stroke-width="3"/>
    <!-- Red/Pink Stripes -->
    <polygon points="28,40 40,40 36,130 25,130" fill="#ff4d6d"/>
    <polygon points="50,40 62,40 56,130 46,130" fill="#ff4d6d"/>
    <polygon points="72,40 84,40 75,130 66,130" fill="#ff4d6d"/>

    <!-- Puffy Popcorn Kernels Overflowing -->
    <g fill="#ffd166">
      <circle cx="30" cy="35" r="12"/>
      <circle cx="50" cy="30" r="14"/>
      <circle cx="70" cy="35" r="13"/>
      <circle cx="40" cy="18" r="13"/>
      <circle cx="60" cy="16" r="12"/>
      <circle cx="50" cy="5" r="11"/>
    </g>
    <!-- White highlights on popcorn -->
    <circle cx="48" cy="28" r="4" fill="#ffffff"/>
    <circle cx="38" cy="16" r="3.5" fill="#ffffff"/>
    <circle cx="58" cy="14" r="3.5" fill="#ffffff"/>

    <!-- Flying Popcorn Kernels (Popcorn Fight!) -->
    <circle cx="10" cy="10" r="7" fill="#ffd166"/>
    <circle cx="-15" cy="35" r="8" fill="#ffd166"/>
    <circle cx="100" cy="15" r="7.5" fill="#ffd166"/>
    <circle cx="115" cy="45" r="8" fill="#ffd166"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(250, 48)" text-anchor="middle">
    <rect x="-145" y="-18" width="290" height="36" rx="18" fill="#ffffff" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.3))"/>
    <text y="6" font-family="'Quicksand', sans-serif" font-size="14.5" font-weight="700" fill="#e73868">🍿 Movie Marathons & Popcorn Fights 🎬</text>
  </g>
</svg>
