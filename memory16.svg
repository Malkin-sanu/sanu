<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f3"/>
      <stop offset="50%" stop-color="#ffb3c6"/>
      <stop offset="100%" stop-color="#ff758f"/>
    </linearGradient>
  </defs>

  <rect width="500" height="400" rx="16" fill="url(#bg16)"/>

  <!-- Confetti & Floating Hearts Background -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="80" cy="80" r="4"/>
    <circle cx="420" cy="110" r="5"/>
    <circle cx="100" cy="280" r="4.5"/>
    <circle cx="390" cy="290" r="4"/>
    <text x="70" y="160" font-size="20">✨</text>
    <text x="410" y="180" font-size="22">✨</text>
    <text x="130" y="320" font-size="24">💖</text>
    <text x="360" y="330" font-size="24">💖</text>
  </g>

  <!-- Big Central Floating Heart Locket with Ribbon -->
  <g transform="translate(250, 200)">
    <!-- Heart Locket -->
    <path d="M 0,-50 C -60,-130 -160,-50 0,90 C 160,-50 60,-130 0,-50 Z" fill="#ffffff" filter="drop-shadow(0 12px 24px rgba(231,56,104,0.4))"/>
    
    <path d="M 0,-40 C -45,-105 -130,-40 0,72 C 130,-40 45,-105 0,-40 Z" fill="#ffe5ec"/>

    <text x="0" y="-8" font-family="'Caveat', cursive" font-size="34" font-weight="700" fill="#e73868" text-anchor="middle">Forever & Always</text>
    <text x="0" y="32" font-family="'Dancing Script', cursive" font-size="38" font-weight="700" fill="#ff4d6d" text-anchor="middle">Best Friends</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(250, 48)" text-anchor="middle">
    <rect x="-145" y="-18" width="290" height="36" rx="18" fill="#ffffff" filter="drop-shadow(0 4px 10px rgba(255,105,135,0.25))"/>
    <text y="6" font-family="'Quicksand', sans-serif" font-size="14.5" font-weight="700" fill="#e73868">💖 Forever My Best Friend, Happy Birthday! 🎉</text>
  </g>
</svg>
