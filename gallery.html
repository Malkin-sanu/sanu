<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="A beautiful Polaroid photo gallery celebrating our unforgettable memories together.">
  <meta name="theme-color" content="#ffe3ec">
  <title>Our Beautiful Memories 📸 - Happy Birthday Sanuu! 💖✨</title>

  <!-- Google Fonts for Dreamy Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&family=Sacramento&display=swap" rel="stylesheet">

  <!-- Shared Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Background Particle & Confetti Canvas -->
  <canvas id="particleCanvas" class="particle-canvas-layer"></canvas>

  <!-- Floating Audio Mute / Unmute Control -->
  <aside class="floating-controls">
    <button id="musicToggleBtn" class="floating-music-btn" aria-label="Toggle background music" title="Toggle background music">
      <span class="music-icon-disc">🔇</span>
    </button>
  </aside>

  <!-- Navigation / Progress Tracker -->
  <nav class="nav-progress-wrapper" aria-label="Surprise progress">
    <div class="nav-track" id="navTrack">
      <a href="index.html" class="nav-dot completed" data-step="1" title="Age Lock" aria-label="Go to Age Lock">
        <span class="dot-icon">🔐</span>
        <span class="dot-label">Lock</span>
      </a>
      <div class="nav-line"></div>
      <a href="letter.html" class="nav-dot completed" data-step="2" title="Birthday Letter" aria-label="Go to Birthday Letter">
        <span class="dot-icon">💌</span>
        <span class="dot-label">Letter</span>
      </a>
      <div class="nav-line"></div>
      <a href="reasons.html" class="nav-dot completed" data-step="3" title="Why You're Special" aria-label="Go to Why You're Special">
        <span class="dot-icon">❤️</span>
        <span class="dot-label">Reasons</span>
      </a>
      <div class="nav-line"></div>
      <a href="gallery.html" class="nav-dot active completed" data-step="4" title="Our Memories" aria-label="Go to Our Memories">
        <span class="dot-icon">📸</span>
        <span class="dot-label">Memories</span>
      </a>
      <div class="nav-line"></div>
      <a href="final.html" class="nav-dot" data-step="5" title="Birthday Surprise" aria-label="Go to Birthday Surprise">
        <span class="dot-icon">🎂</span>
        <span class="dot-label">Surprise</span>
      </a>
    </div>
  </nav>

  <!-- Main Content Presentation -->
  <main class="main-content-flow">

    <!-- ========================================================
         PAGE 4: YOUR BEAUTIFUL MEMORIES 📸
         ======================================================== -->
    <section id="section-memories" class="page-section active" aria-hidden="false">
      <div class="section-container memories-section-container">
        
        <header class="section-title-wrap">
          <span class="cute-tag">OUR TIME CAPSULE 🌸</span>
          <h2 class="section-main-heading">Our Beautiful Memories</h2>
          <p class="section-sub-heading">Frozen moments of friendship, laughter, and endless smiles 💕</p>
          
          <div class="gallery-controls">
            <button type="button" id="startSlideshowBtn" class="pill-btn secondary-pill">
              <span>▶ Slideshow Mode</span>
            </button>
          </div>
        </header>

        <!-- Polaroid Photo Gallery Grid -->
        <div class="gallery-grid" id="galleryGrid">
          <!-- Populated dynamically from config.memories -->
        </div>

        <!-- Continue Button -->
        <div class="section-continue-row">
          <a href="final.html" class="pill-btn next-step-btn" data-next-section="5">
            <span>Continue to Final Surprise 🎂 ➔</span>
          </a>
        </div>

      </div>
    </section>

  </main>

  <!-- Photo Lightbox Dialog (Modern Accessible HTML5 Dialog) -->
  <dialog id="lightboxDialog" class="lightbox-dialog" aria-label="Photo Lightbox">
    <div class="lightbox-content-box">
      <button type="button" id="lightboxCloseBtn" class="lightbox-close-btn" aria-label="Close dialog">✕</button>
      
      <div class="lightbox-image-wrapper">
        <img id="lightboxImg" src="" alt="Memory full view" class="lightbox-img" />
      </div>

      <div class="lightbox-details">
        <p id="lightboxCaption" class="lightbox-caption"></p>
        <span id="lightboxDate" class="lightbox-date"></span>
        <span id="lightboxCounter" class="lightbox-counter"></span>
      </div>

      <!-- Navigation Arrows -->
      <button type="button" id="lightboxPrevBtn" class="lightbox-nav-btn prev-btn" aria-label="Previous photo">‹</button>
      <button type="button" id="lightboxNextBtn" class="lightbox-nav-btn next-btn" aria-label="Next photo">›</button>
    </div>
  </dialog>

  <!-- Shared Scripts -->
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
