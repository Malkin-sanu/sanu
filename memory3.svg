<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="50%" stop-color="#ffccd5"/>
      <stop offset="100%" stop-color="#ffb3c1"/>
    </linearGradient>
    <linearGradient id="cameraGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff0f5"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3042"/>
      <stop offset="100%" stop-color="#1b1725"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" rx="16" fill="url(#bg3)"/>

  <!-- Background sparkles & confetti -->
  <g fill="#ff758f" opacity="0.3">
    <circle cx="80" cy="90" r="12"/>
    <circle cx="420" cy="110" r="16"/>
    <circle cx="90" cy="320" r="14"/>
    <circle cx="410" cy="320" r="10"/>
    <polygon points="120,40 123,48 131,51 123,54 120,62 117,54 109,51 117,48" fill="#ffb703"/>
    <polygon points="380,60 383,68 391,71 383,74 380,82 377,74 369,71 377,68" fill="#ffb703"/>
  </g>

  <!-- Film Strip hanging at top left -->
  <g transform="translate(60, 40) rotate(-12)">
    <rect width="60" height="150" rx="4" fill="#222222"/>
    <!-- Film sprocket holes -->
    <rect x="4" y="10" width="6" height="10" rx="2" fill="#ffffff"/>
    <rect x="4" y="30" width="6" height="10" rx="2" fill="#ffffff"/>
    <rect x="4" y="50" width="6" height="10" rx="2" fill="#ffffff"/>
    <rect x="4" y="70" width="6" height="10" rx="2" fill="#ffffff"/>
    <rect x="4" y="90" width="6" height="10" rx="2" fill="#ffffff"/>
    <rect x="4" y="110" width="6" height="10" rx="2" fill="#ffffff"/>
    <rect x="4" y="130" width="6" height="10" rx="2" fill="#ffffff"/>

    <rect x="50" y="10" width="6" height="10" rx="2" fill="#ffffff"/>
    <rect x="50" y="30" width="6" height="10" rx="2" fill="#ffffff"/>
    <rect x="50" y="50" width="6" height="10" rx="2" fill="#ffffff"/>
    <rect x="50" y="70" width="6" height="10" rx="2" fill="#ffffff"/>
    <rect x="50" y="90" width="6" height="10" rx="2" fill="#ffffff"/>
    <rect x="50" y="110" width="6" height="10" rx="2" fill="#ffffff"/>
    <rect x="50" y="130" width="6" height="10" rx="2" fill="#ffffff"/>

    <!-- Frames -->
    <rect x="15" y="15" width="30" height="35" fill="#ff758f" opacity="0.8"/>
    <rect x="15" y="58" width="30" height="35" fill="#ff4d6d" opacity="0.8"/>
    <rect x="15" y="101" width="30" height="35" fill="#e73868" opacity="0.8"/>
  </g>

  <!-- Cute Retro Instant Camera (Center) -->
  <g transform="translate(170, 140)">
    <!-- Camera Body Shadow -->
    <rect x="5" y="10" width="170" height="160" rx="28" fill="#e09fbe" opacity="0.4"/>
    <!-- Camera Body -->
    <rect x="0" y="0" width="170" height="160" rx="26" fill="url(#cameraGrad)" stroke="#ffb3c6" stroke-width="4"/>

    <!-- Pastel Color Stripes across camera -->
    <rect x="0" y="70" width="170" height="8" fill="#ff758f"/>
    <rect x="0" y="78" width="170" height="8" fill="#ffb703"/>
    <rect x="0" y="86" width="170" height="8" fill="#70c1b3"/>

    <!-- Big Center Lens -->
    <circle cx="85" cy="85" r="48" fill="#e9ecef" stroke="#ff85a1" stroke-width="3"/>
    <circle cx="85" cy="85" r="40" fill="url(#lensGrad)"/>
    <circle cx="85" cy="85" r="28" fill="#2d132c"/>
    <circle cx="85" cy="85" r="16" fill="#431c3e"/>
    <!-- Lens reflection -->
    <ellipse cx="76" cy="74" rx="8" ry="5" fill="#ffffff" opacity="0.7" transform="rotate(-30, 76, 74)"/>
    <circle cx="94" cy="95" r="4" fill="#ffffff" opacity="0.5"/>

    <!-- Viewfinder -->
    <rect x="125" y="22" width="24" height="20" rx="5" fill="#3a3042" stroke="#ffccd5" stroke-width="2"/>
    <rect x="129" y="26" width="16" height="12" rx="3" fill="#70c1b3" opacity="0.7"/>

    <!-- Flash -->
    <circle cx="35" cy="32" r="14" fill="#fff3b0" stroke="#ffccd5" stroke-width="2"/>
    <circle cx="35" cy="32" r="7" fill="#ffe66d"/>

    <!-- Shutter Button -->
    <rect x="25" y="-10" width="22" height="10" rx="4" fill="#ff4d6d"/>

    <!-- Emerging Polaroid Photo from top slot! -->
    <g transform="translate(35, -95)">
      <rect width="100" height="95" rx="6" fill="#ffffff" stroke="#ffccd5" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
      <rect x="8" y="8" width="84" height="60" rx="4" fill="#ffccd5"/>
      <!-- Heart in photo -->
      <path d="M 50,30 C 50,22 62,22 62,30 C 62,40 50,50 50,50 C 50,50 38,40 38,30 C 38,22 50,22 50,30 Z" fill="#ff4d6d"/>
      <text x="50" y="82" font-family="'Quicksand', sans-serif" font-size="9" font-weight="700" fill="#ff758f" text-anchor="middle">SMILE BESTIE 💕</text>
    </g>
  </g>

  <!-- Title Badge -->
  <g transform="translate(250, 360)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#ffffff" filter="drop-shadow(0 4px 10px rgba(255,105,135,0.25))"/>
    <text y="6" font-family="'Quicksand', sans-serif" font-size="15" font-weight="700" fill="#e73868">📸 A Million Silly Selfies & Laughs ✨</text>
  </g>
</svg>
