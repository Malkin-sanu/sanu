<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg13" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="50%" stop-color="#ffe5ec"/>
      <stop offset="100%" stop-color="#ffb3c6"/>
    </linearGradient>
  </defs>

  <rect width="500" height="400" rx="16" fill="url(#bg13)"/>

  <!-- Kitchen Countertop -->
  <rect x="0" y="290" width="500" height="110" fill="#ffffff"/>
  <line x1="0" y1="290" x2="500" y2="290" stroke="#ffccd5" stroke-width="4"/>

  <!-- Cute Chef Hat -->
  <g transform="translate(195, 110)">
    <path d="M 25,70 L 85,70 L 90,55 C 105,55 115,35 100,20 C 105,0 75,-15 55,0 C 35,-15 5,0 10,20 C -5,35 5,55 20,55 Z" fill="#ffffff" stroke="#ffccd5" stroke-width="2.5"/>
    <rect x="25" y="70" width="60" height="15" rx="4" fill="#ff758f"/>
    <circle cx="55" cy="77" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Big Delicious Cupcake in Center -->
  <g transform="translate(190, 195)">
    <!-- Cupcake Wrapper -->
    <polygon points="25,60 95,60 85,120 35,120" fill="#ffd166" stroke="#f4a261" stroke-width="2"/>
    <line x1="40" y1="60" x2="47" y2="120" stroke="#e76f51" stroke-width="1.5"/>
    <line x1="60" y1="60" x2="60" y2="120" stroke="#e76f51" stroke-width="1.5"/>
    <line x1="80" y1="60" x2="73" y2="120" stroke="#e76f51" stroke-width="1.5"/>

    <!-- Puffy Swirled Frosting -->
    <path d="M 15,60 C 15,30 45,30 45,45 C 45,20 75,20 75,45 C 75,30 105,30 105,60 Z" fill="#ff758f"/>
    <path d="M 30,40 C 30,15 60,15 60,30 C 60,15 90,15 90,40 Z" fill="#ff85a1"/>
    <circle cx="60" cy="15" r="14" fill="#ffffff"/>

    <!-- Strawberry on Top -->
    <circle cx="60" cy="2" r="10" fill="#e63946"/>
    <ellipse cx="58" cy="0" rx="2" ry="1" fill="#ffffff"/>
  </g>

  <!-- Spilled Flour & Whisk (Left) -->
  <g transform="translate(100, 260)">
    <ellipse cx="40" cy="40" rx="35" ry="12" fill="#ffffff" opacity="0.9"/>
    <!-- Wire Whisk -->
    <line x1="15" y1="20" x2="70" y2="40" stroke="#9a8c98" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="65" cy="38" rx="14" ry="8" fill="none" stroke="#9a8c98" stroke-width="2" transform="rotate(20, 65, 38)"/>
  </g>

  <!-- Rolling Pin (Right) -->
  <g transform="translate(320, 275) rotate(-15)">
    <rect x="20" y="5" width="80" height="18" rx="4" fill="#ddb892"/>
    <rect x="0" y="10" width="20" height="8" rx="2" fill="#b08968"/>
    <rect x="100" y="10" width="20" height="8" rx="2" fill="#b08968"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(250, 48)" text-anchor="middle">
    <rect x="-145" y="-18" width="290" height="36" rx="18" fill="#ffffff" filter="drop-shadow(0 4px 10px rgba(255,105,135,0.25))"/>
    <text y="6" font-family="'Quicksand', sans-serif" font-size="14.5" font-weight="700" fill="#e73868">🧁 Cooking Disasters & Sweet Treats 👩‍🍳</text>
  </g>
</svg>
