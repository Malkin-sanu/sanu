<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f3"/>
      <stop offset="50%" stop-color="#ffd6e0"/>
      <stop offset="100%" stop-color="#ffb3c6"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="50%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758f"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" rx="16" fill="url(#bg4)"/>

  <!-- Party Bunting / Flags at the Top -->
  <g>
    <path d="M 0,20 Q 125,50 250,30 Q 375,50 500,20" fill="none" stroke="#ff85a1" stroke-width="2"/>
    <!-- Triangular Bunting Flags -->
    <polygon points="40,25 65,27 52,65" fill="#ff758f"/>
    <polygon points="85,32 110,36 97,75" fill="#ffb703"/>
    <polygon points="135,39 160,40 147,80" fill="#70c1b3"/>
    <polygon points="185,37 210,34 197,76" fill="#ff85a1"/>
    <polygon points="235,31 260,31 247,72" fill="#ffd166"/>
    <polygon points="285,34 310,37 297,76" fill="#ff758f"/>
    <polygon points="335,40 360,39 347,80" fill="#70c1b3"/>
    <polygon points="385,36 410,32 397,75" fill="#ffb703"/>
    <polygon points="435,27 460,25 447,65" fill="#ff758f"/>
  </g>

  <!-- Floating Balloons -->
  <!-- Left Balloon -->
  <g transform="translate(80, 110)">
    <path d="M 30,70 Q 25,120 40,180" fill="none" stroke="#ffccd5" stroke-width="2"/>
    <ellipse cx="30" cy="35" rx="30" ry="38" fill="#ff758f"/>
    <polygon points="26,73 34,73 30,80" fill="#ff758f"/>
    <ellipse cx="20" cy="22" rx="7" ry="14" fill="#ffffff" opacity="0.5" transform="rotate(-25, 20, 22)"/>
  </g>
  <!-- Right Balloon -->
  <g transform="translate(370, 90)">
    <path d="M 30,70 Q 35,120 20,200" fill="none" stroke="#ffccd5" stroke-width="2"/>
    <ellipse cx="30" cy="35" rx="28" ry="36" fill="#ffd166"/>
    <polygon points="26,71 34,71 30,78" fill="#ffd166"/>
    <ellipse cx="20" cy="22" rx="6" ry="12" fill="#ffffff" opacity="0.6" transform="rotate(-25, 20, 22)"/>
  </g>
  <!-- Center Balloon (Behind) -->
  <g transform="translate(290, 80)">
    <path d="M 25,60 Q 15,110 30,190" fill="none" stroke="#ffccd5" stroke-width="2"/>
    <ellipse cx="25" cy="30" rx="24" ry="32" fill="#70c1b3"/>
    <polygon points="22,62 28,62 25,68" fill="#70c1b3"/>
  </g>

  <!-- Center Birthday Crown / Tiara -->
  <g transform="translate(250, 150)">
    <path d="M -70,30 L -90,-20 L -35,5 L 0,-40 L 35,5 L 90,-20 L 70,30 Z" fill="url(#crownGrad)" stroke="#fb8500" stroke-width="3"/>
    <!-- Crown Jewels -->
    <circle cx="0" cy="-38" r="9" fill="#e63946" stroke="#ffffff" stroke-width="2"/>
    <circle cx="-90" cy="-18" r="7" fill="#ff758f" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="90" cy="-18" r="7" fill="#ff758f" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="-35" cy="7" r="7" fill="#70c1b3" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="35" cy="7" r="7" fill="#70c1b3" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Crown Rim Base -->
    <rect x="-70" y="26" width="140" height="14" rx="7" fill="#fb8500"/>
    <circle cx="-45" cy="33" r="3" fill="#ffffff"/>
    <circle cx="-15" cy="33" r="3" fill="#ffffff"/>
    <circle cx="15" cy="33" r="3" fill="#ffffff"/>
    <circle cx="45" cy="33" r="3" fill="#ffffff"/>
  </g>

  <!-- Big Gift Box in Front -->
  <g transform="translate(190, 230)">
    <!-- Box Body -->
    <rect x="0" y="25" width="120" height="95" rx="8" fill="url(#boxGrad)"/>
    <!-- Vertical Ribbon -->
    <rect x="48" y="25" width="24" height="95" fill="#ffd166"/>
    <!-- Horizontal Ribbon -->
    <rect x="0" y="60" width="120" height="20" fill="#ffd166"/>
    <!-- Box Lid -->
    <rect x="-6" y="10" width="132" height="22" rx="6" fill="#ff4d6d"/>
    <rect x="48" y="10" width="24" height="22" fill="#ffd166"/>

    <!-- Ribbon Bow on Top -->
    <g transform="translate(60, 10)">
      <ellipse cx="-20" cy="-10" rx="18" ry="12" fill="#ffd166" transform="rotate(-25, -20, -10)"/>
      <ellipse cx="20" cy="-10" rx="18" ry="12" fill="#ffd166" transform="rotate(25, 20, -10)"/>
      <circle cx="0" cy="-5" r="8" fill="#fb8500"/>
    </g>
  </g>

  <!-- Title Badge -->
  <g transform="translate(250, 365)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#ffffff" filter="drop-shadow(0 4px 10px rgba(255,105,135,0.25))"/>
    <text y="6" font-family="'Quicksand', sans-serif" font-size="15" font-weight="700" fill="#e73868">👑 Birthday Queen in the Making 💖</text>
  </g>
</svg>
