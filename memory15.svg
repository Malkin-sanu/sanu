<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg15" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="50%" stop-color="#ffd6e0"/>
      <stop offset="100%" stop-color="#ffb3c6"/>
    </linearGradient>
  </defs>

  <rect width="500" height="400" rx="16" fill="url(#bg15)"/>

  <!-- Vertical Photobooth Strip (Center) -->
  <g transform="translate(185, 80) rotate(-4)">
    <!-- Strip White Border -->
    <rect width="130" height="280" rx="8" fill="#ffffff" stroke="#ffccd5" stroke-width="2.5" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.12))"/>

    <!-- Photobooth Photo 1 (Top) -->
    <rect x="12" y="14" width="106" height="74" rx="4" fill="#ffe5ec"/>
    <!-- Cute matching glasses / bow -->
    <text x="65" y="58" font-size="28" text-anchor="middle">✌️😜</text>

    <!-- Photobooth Photo 2 (Middle) -->
    <rect x="12" y="98" width="106" height="74" rx="4" fill="#ffe5ec"/>
    <!-- Cute silly faces -->
    <text x="65" y="142" font-size="28" text-anchor="middle">👯‍♀️💖</text>

    <!-- Photobooth Photo 3 (Bottom) -->
    <rect x="12" y="182" width="106" height="74" rx="4" fill="#ffe5ec"/>
    <!-- Heart hands -->
    <text x="65" y="226" font-size="28" text-anchor="middle">🫶✨</text>

    <!-- Bottom photobooth stamp text -->
    <text x="65" y="270" font-family="'Quicksand', sans-serif" font-size="9" font-weight="800" fill="#ff758f" text-anchor="middle">BESTIES 4EVER</text>
  </g>

  <!-- Cute Sticker Pins on Strip -->
  <circle cx="178" cy="88" r="7" fill="#ffd166"/>
  <text x="178" y="92" font-size="9" text-anchor="middle">⭐</text>

  <!-- Title Badge -->
  <g transform="translate(250, 48)" text-anchor="middle">
    <rect x="-145" y="-18" width="290" height="36" rx="18" fill="#ffffff" filter="drop-shadow(0 4px 10px rgba(255,105,135,0.25))"/>
    <text y="6" font-family="'Quicksand', sans-serif" font-size="14.5" font-weight="700" fill="#e73868">🎀 Photobooth Strips & Goofy Poses 📸</text>
  </g>
</svg>
